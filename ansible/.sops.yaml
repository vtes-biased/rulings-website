---
# yamllint disable rule:line-length
# Who can decrypt secrets/vault-pass.sops.yaml: the admins' SSH public keys (ssh-ed25519 or
# ssh-rsa) as age recipients, lionel-panhaleux's two here. Public, safe to commit. After changing
# the list, `sops updatekeys secrets/vault-pass.sops.yaml` re-keys the file (wiki/deploy.md). Keep it
# pinned and reviewed: a hijacked GitHub account can swap the keys it serves, never refetch blindly.
creation_rules:
  - path_regex: secrets/vault-pass\.sops\.yaml$
    age: >-
      ssh-rsa ,
      ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE+Fa+dmnpPBYM0G7xPupl+GkVdF6YFmZ/NkpyqOzWoI
